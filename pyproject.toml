[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bruno-cli"
version = "0.1.0"
description = "An intelligent CLI research agent for developers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Pranjal Maheshwari", email = "f20221658@pilani.bits-pilani.ac.in"},
]
keywords = ["cli", "ai", "agent", "rag", "llm", "mcp", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # CLI & Display
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    
    # LLM & Agent
    "langgraph>=0.3.0",
    "langgraph-prebuilt>=0.1.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    
    # RAG & Vector DB
    "langchain-chroma>=0.2.0",
    "chromadb>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    
    # Embeddings (local)
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",
    
    # MCP
    "mcp[cli]>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    
    # Config
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "build>=1.0",
    "mypy>=1.10.0",
]

[project.scripts]
bruno = "bruno.cli.app:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/bruno"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
